server {
    listen 80;
    server_name icpfnetengineering.com www.icpfnetengineering.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name icpfnetengineering.com www.icpfnetengineering.com;

    ssl_certificate /etc/letsencrypt/live/icpf-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icpf-wildcard/privkey.pem;

    root /opt/icp-website/current/apps/web/dist;
    index index.html;

    location /assets/ {
        alias /opt/icp-website/web-assets-current/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Expires "0" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
