name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @icp/server run prisma:generate
        env:
          # Client generation validates the URL format but does not access the database.
          # Production migrations run on the droplet with its real environment values.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/icp_website?schema=public

      - name: Build web
        run: pnpm --filter @icp/web run build

      - name: Build server
        run: pnpm --filter @icp/server run build

      - name: Deploy to droplet via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/icp-website

            echo "--- Pulling latest code ---"
            git pull origin main

            echo "--- Installing dependencies ---"
            pnpm install --frozen-lockfile

            echo "--- Running Prisma setup ---"
            pnpm --filter @icp/server run prisma:setup:prod

            echo "--- Building server ---"
            pnpm --filter @icp/server run build

            echo "--- Building web ---"
            pnpm --filter @icp/web run build

            echo "--- Reloading PM2 process ---"
            pm2 reload icp-server --update-env

            echo "--- Done ---"
