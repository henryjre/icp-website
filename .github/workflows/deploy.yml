name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate zero-downtime migrations
        run: |
          node --test scripts/check-zero-downtime-migrations.test.mjs
          bash scripts/check-zero-downtime-migrations.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @icp/server run prisma:generate
        env:
          # Client generation validates the URL format but does not access the database.
          # Production migrations run on the droplet with its real environment values.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/icp_website?schema=public

      - name: Build web
        run: pnpm --filter @icp/web run build

      - name: Build server
        run: pnpm --filter @icp/server run build

      - name: Deploy to droplet via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: COMMIT_SHA,RELEASE_ID
          script: |
            set -Eeuo pipefail
            export DEPLOY_ROOT=/opt/icp-website

            if [ ! -d "$DEPLOY_ROOT/repo/.git" ]; then
              echo "Zero-downtime layout is not initialized. Run scripts/bootstrap-zero-downtime.sh as root." >&2
              exit 1
            fi

            (
              flock -n 9 || { echo "Another production deployment is active." >&2; exit 1; }
              git -C "$DEPLOY_ROOT/repo" fetch --prune origin "$COMMIT_SHA"
              git -C "$DEPLOY_ROOT/repo" checkout --detach --force "$COMMIT_SHA"
              exec "$DEPLOY_ROOT/repo/scripts/deploy-production.sh" "$COMMIT_SHA" "$RELEASE_ID"
            ) 9>"$DEPLOY_ROOT/.deploy.lock"
